        - contract-call:
            contract-id: SPSX722NK9V3A8D3CVQT0CDY4EBQ3E9FSDDE61FT.liquidity-provider-v1
            expected-sender: SPSX722NK9V3A8D3CVQT0CDY4EBQ3E9FSDDE61FT
            method: initialize
