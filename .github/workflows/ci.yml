name: CI
on: [push]
permissions:
  contents: read
jobs:
  tests:
    name: "Test contracts with Clarinet"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: "Install Clarinet"
        run: |
          curl -L https://github.com/hirosystems/clarinet/releases/download/v3.22.0/clarinet-linux-x64-glibc.tar.gz | tar -xz
          chmod +x ./clarinet
          echo "$PWD" >> "$GITHUB_PATH"
      - name: "Check contract syntax"
        run: clarinet check
      - name: "Setup Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.x"
      - name: "Prep CI"
        run: npm ci
      - name: "Execute unit tests"
        run: npm run test:report
