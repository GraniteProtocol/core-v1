name: CI
on: [push]
jobs:
  tests:
    name: "Test contracts with Clarinet"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v3
        with:
          submodules: true
      - name: "Check contract syntax"
        uses: docker://hirosystems/clarinet:latest
        with:
          args: check
      - name: "Restore deployment plan"
        # clarinet check rewrites the simnet plan into a format the sdk
        # cannot parse; restore the committed one before vitest.
        run: git checkout -- deployments/default.simnet-plan.yaml
      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: "Prep CI"
        run: npm ci
      - name: "Execute unit tests"
        run: npm run test:report
      - name: "Upload code coverage"
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.lcov
          verbose: true
